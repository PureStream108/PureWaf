[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PureWaf"
version = "2.1.2"
description = "WAF Bypass Payload Generator"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Pure Stream" }]
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
webui = ['flask>=3.1,<4; python_version >= "3.9"']

[project.urls]
Homepage = "https://github.com/PureStream108/PureWaf"
Repository = "https://github.com/PureStream108/PureWaf"

[tool.setuptools.packages.find]
include = ["PureWaf*"]
